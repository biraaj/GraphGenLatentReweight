defaults:
  - encoder : lpe_mlp_gine_planar
  - denoiser : dit_tiny
  - dataset : planar
  - _self_

encoder:
  ds_dim: 16
  modulation: 0.

root: null
ae_checkpoint_file: planar_ae_vgae_best
checkpoint: planar_fm_vgae_best

# Training
seed: 0
lr_scheduler: 'constant'
lr: 2e-4
min_lr: 1e-4
lr_decay_iters: 3e5
weight_decay: 1e-12
gradient_norm: null
batch_size: 32
num_steps: 5e5
num_warmup_steps: 4000
num_workers: 4
log_after: 1000
val_after: 12000
num_samples: 256
num_sample_batch: 4
num_folds: 5
dropout: 0.
noise: 0.
sc_prob: 0.5
sample: True

# FM
param: 'x_0'
num_sampling_steps: 100
time_density: 'log_norm'
density_params: [0.,1.]
sampling_time_density: 'log_norm'
sampling_density_params: [0.,1.]

# Must match AE checkpoint
encoder_type: vgae
decoder_type: transformer
decoder_hidden_dim: 256
decoder_num_layers: 4
decoder_num_heads: 4

# Misc
wandb_project: your-wandb-project
wandb_entity: your-wandb-entity
wandb_name: planar-fm-vgae-test

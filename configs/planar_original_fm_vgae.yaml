defaults:
  - encoder: lpe_mlp_gine_planar
  - denoiser: dit_tiny
  - dataset: planar_original
  - _self_

# Same reasoning as planar_original_ae_vgae.yaml: mirror tree_original's confirmed
# pe_dim=16 rather than planar's pe_dim=128.
encoder:
  pe_dim: 16

root: null
ae_checkpoint_file: planar_original_ae_vgae_best
checkpoint: planar_original_fm_vgae_best

# Training  (tuned for small DiGress dataset: 128 train / 32 val / 40 test)
seed: 0
lr_scheduler: 'constant'
lr: 2e-4
min_lr: 1e-4
lr_decay_iters: 1e5
weight_decay: 1e-12
gradient_norm: null
batch_size: 32
num_steps: 1e5
num_warmup_steps: 800
num_workers: 0
log_after: 500
val_after: 2000
num_samples: 40
num_sample_batch: 1
dropout: 0.
noise: 0.
sc_prob: 0.5
sample: True
selection_metric: 'acc'
selection_mode: 'max'
save_every_eval: False

# FM
param: 'x_0'
num_sampling_steps: 100
time_density: 'log_norm'
density_params: [0.,1.]
sampling_time_density: 'log_norm'
sampling_density_params: [0.,1.]

# Must match AE checkpoint
encoder_type: vgae
decoder_type: transformer
decoder_hidden_dim: 256
decoder_num_layers: 4
decoder_num_heads: 4

# Misc
wandb_project: your-wandb-project
wandb_entity: your-wandb-entity
wandb_name: planar-original-fm-vgae

# 128-node uniform random labeled trees, pe_dim=128, num_vecs=16, modulation=0.005,
# ds_dim=24, sign_flip_aug/spectral_phi enabled (see configs/encoder/lpe_mlp_gine_tree128.yaml).
# dataset_root points inside dataset_cache/tree/ so this resolves to dataset_cache/tree/tree_128.
defaults:
  - encoder: lpe_mlp_gine_tree128
  - dataset: tree_128
  - _self_

root: null
dataset_root: dataset_cache/tree
checkpoint: tree_ae_vgae_128_best

# Training
seed: 0
lr_scheduler: 'cosine'
lr: 3e-4
min_lr: 1e-4
lr_decay_iters: 3.5e4
weight_decay: 1e-4
gradient_norm: 1.0
batch_size: 256
num_steps: 3.5e4
num_warmup_steps: 100
num_workers: 0
log_after: 500
val_after: 1000
kl_weight: 1e-6
equi_weight: 0.
dropout: 0.

# Encoder: VGAE-style (EncoderGINVAE), matched to lgvae's options -- see
# configs/encoder/lpe_mlp_gine_tree128.yaml
encoder_type: vgae

# Decoder: Set Transformer + bilinear (same as tree_ae_vgae.yaml)
decoder_type: transformer
decoder_hidden_dim: 256
decoder_num_layers: 4
decoder_num_heads: 4

# Misc
wandb_project: your-wandb-project
wandb_entity: your-wandb-entity
wandb_name: tree128-ae-vgae-matched-lgvae

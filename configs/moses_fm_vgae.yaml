defaults:
  - encoder : lpe_mlp_gine_moses
  - denoiser : dit_medium
  - dataset : moses
  - _self_

encoder:
  modulation: 0.

root: null
ae_checkpoint_file: moses_ae_vgae_specphi_best
checkpoint: moses_fm_vgae_specphi_baseline

# Training
seed: 0
lr_scheduler: 'constant'
lr: 2e-4
min_lr: 1e-4
lr_decay_iters: 1e6
weight_decay: 1e-1
gradient_norm: null
batch_size: 1024
num_steps: 6e5
num_warmup_steps: 4000
num_workers: 4
log_after: 1000
val_after: 12000
num_samples: 2048
num_sample_batch: 4
dropout: 0.1
noise: 0.
sc_prob: 0.5
selection_metric: 'valid'
selection_mode: 'max'
save_every_eval: False

# FM
param: 'x_0'
num_sampling_steps: 100
time_density: 'log_norm'
density_params: [0.,1.]
sampling_time_density: 'log_norm'
sampling_density_params: [0.,1.]
fm_mse_weight: 1.0

# Must match AE checkpoint (sign_flip_aug + spectral_phi enabled -- see
# configs/encoder/lpe_mlp_gine_moses.yaml)
encoder_type: vgae
decoder_type: transformer
decoder_hidden_dim: 256
decoder_num_layers: 4
decoder_num_heads: 4

strict_ae_load: true
norm_loss_weight: 0.0

# Misc
wandb_project: your-wandb-project
wandb_entity: your-wandb-entity
wandb_name: moses-fm-vgae-specphi-baseline

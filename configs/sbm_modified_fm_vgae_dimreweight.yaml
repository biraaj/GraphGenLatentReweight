# Dimreweight counterpart of sbm_modified_fm_vgae.yaml; matches the paper's reported
# VGAE+Flow+LIR SBM numbers (acc_mean=0.232, ratio_mean=3.61 at num_sampling_steps=1000, k-fold).
defaults:
  - encoder : lpe_mlp_gine_sbm
  - denoiser : dit_tiny
  - dataset : sbm_modified
  - _self_

encoder:
  modulation: 0.

root: null
ae_checkpoint_file: sbm_modified_ae_vgae_specphi_best
checkpoint: sbm_modified_fm_vgae_specphi_dimreweight_jacobian_mu_floor01_v5

# Training
seed: 0
lr_scheduler: 'constant'
lr: 5e-5
min_lr: 3e-4
lr_decay_iters: 3e5
weight_decay: 1e-12
gradient_norm: 1.0
batch_size: 256
num_steps: 5e5
num_warmup_steps: 4000
num_workers: 4
log_after: 1000
val_after: 12000
num_samples: 256
num_sample_batch: 8
dropout: 0.
noise: 0.
sc_prob: 0.5
sample: True
selection_metric: 'acc'
selection_mode: 'max'
save_every_eval: False

# FM
param: 'x_0'
num_sampling_steps: 100
time_density: 'log_norm'
density_params: [0.,1.]
sampling_time_density: 'log_norm'
sampling_density_params: [0.,1.]
fm_mse_weight: 1.0

dim_reweight: true
dim_reweight_floor: 0.1

# Must match AE checkpoint
encoder_type: vgae
decoder_type: transformer
decoder_hidden_dim: 256
decoder_num_layers: 4
decoder_num_heads: 4

strict_ae_load: true
norm_loss_weight: 0.0

# Misc
wandb_project: your-wandb-project
wandb_entity: your-wandb-entity
wandb_name: sbm-modified-fm-vgae-specphi-dimreweight-jacobian-mu-floor01-v5

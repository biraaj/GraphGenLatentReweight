defaults:
  - encoder: lpe_mlp_gine_planar
  - dataset: planar
  - _self_

encoder:
  ds_dim: 16
  modulation: 0.

root: null
checkpoint: planar_ae_vgae_best

# Training
seed: 0
lr_scheduler: 'cosine'
lr: 5.5e-4
min_lr: 4e-4
lr_decay_iters: 5e4
weight_decay: 1e-4
gradient_norm: 1.0
batch_size: 256
num_steps: 5e4
num_warmup_steps: 100
num_workers: 0
log_after: 500
val_after: 2000
kl_weight: 1e-6
equi_weight: 0.
dropout: 0.

# Encoder: VGAE-style — LPE features projected by a single linear layer
# (no per-vector phi FFN, no sign-flip augmentation, no orbit modulation)
encoder_type: vgae

# Decoder: Set Transformer + bilinear (same as the chosen best decoder)
decoder_type: transformer
decoder_hidden_dim: 256
decoder_num_layers: 4
decoder_num_heads: 4

# Misc
wandb_project: your-wandb-project
wandb_entity: your-wandb-entity
wandb_name: planar-ae-vgae

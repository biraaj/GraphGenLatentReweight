name: 'lpe'
num_vecs: 32
normalized_laplacian: no
normalize_eigenvecs: True
phi_model: 'mlp'
rho_model: 'gin'
pe_dim: 128
modulation: 0.0
sign_flip_aug: true   # EncoderGINVAE only; matches the actual trained checkpoint
spectral_phi: true
ds_dim: 16

phi:
  num_layers: 2
  hidden_dim: 384
  bias: True
  dropout: 0.

rho:
  num_layers: 16
  embed_dim: 384
  norm: 'batch_norm'

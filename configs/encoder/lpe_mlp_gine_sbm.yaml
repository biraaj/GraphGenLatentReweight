name: 'lpe'
num_vecs: 16
normalized_laplacian: no
normalize_eigenvecs: True
phi_model: 'mlp'
rho_model: 'gin'
pe_dim: 128
modulation: 0.0
sign_flip_aug: true   # EncoderGINVAE only; matches the actual trained checkpoint
spectral_phi: true    # phi(v,lambda)-sum instead of flat Linear -- basis-robust for degenerate spectra (SBM)
ds_dim: 16

phi:
  num_layers: 2
  hidden_dim: 256
  bias: True
  dropout: 0.

rho:
  num_layers: 16
  embed_dim: 256
  norm: 'batch_norm'
